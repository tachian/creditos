name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.16"

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Summarize changed areas
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"

            if ! git cat-file -e "$base_sha^{commit}"; then
              git fetch --no-tags --depth=1 origin "$base_sha"
            fi

            if git cat-file -e "$head_sha^{commit}"; then
              git diff --name-status -M -z "$base_sha...$head_sha" > changed-files.txt
            else
              git diff --name-status -M -z "$base_sha...HEAD" > changed-files.txt
            fi
          else
            git fetch --no-tags --depth=1 origin main
            git diff --name-status -M -z origin/main...HEAD > changed-files.txt
          fi

          python scripts/ci_changed_areas.py < changed-files.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Scan repository for secrets
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            git fetch --no-tags --depth=1 origin main
            log_opts="origin/main..HEAD"
          fi

          # gitleaks v8.30.1
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo \
            --log-opts="$log_opts" \
            --redact=100 \
            --no-banner \
            --exit-code 1 \
            --verbose

      - name: Check uv lockfile
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

      - name: Validate versioned contracts
        run: uv run python scripts/check_contracts.py

      - name: Validate local harness
        run: uv run python scripts/local_harness.py check

      - name: Run pytest
        run: uv run pytest
