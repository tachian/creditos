groups:
  - name: "creditos-internal-platform-slo"
    interval: "30s"
    rules:
      - alert: "HighErrorRate"
        expr: "sum by (service, environment) (rate(creditos_requests_total{environment=~\".+\",status=~\"error|failed\"}[5m])) / clamp_min(sum by (service, environment) (rate(creditos_requests_total{environment=~\".+\"}[5m])), 0.001) > 0.05"
        for: "5m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "error-rate"
        annotations:
          dashboard: "dashboards/internal/platform-overview"
          description: "Erro agregado acima do limite operacional em serviço interno."
          runbook: "runbooks/observability/high-error-rate.md"
          summary: "Taxa de erro elevada por serviço"
      - alert: "HighLatencyP95"
        expr: "histogram_quantile(0.95, sum by (service, environment, le) (rate(creditos_request_duration_bucket{environment=~\".+\"}[5m]))) > 750"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "latency"
        annotations:
          dashboard: "dashboards/internal/platform-overview"
          description: "Percentil p95 sustentado acima do limite operacional."
          runbook: "runbooks/observability/high-latency.md"
          summary: "Latência p95 elevada por serviço"
      - alert: "HighLatencyP99"
        expr: "histogram_quantile(0.99, sum by (service, environment, le) (rate(creditos_request_duration_bucket{environment=~\".+\"}[5m]))) > 1500"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "latency"
        annotations:
          dashboard: "dashboards/internal/platform-overview"
          description: "Percentil p99 sustentado acima do limite crítico."
          runbook: "runbooks/observability/high-latency.md"
          summary: "Latência p99 crítica por serviço"
      - alert: "ServiceSaturation"
        expr: "max by (service, environment, operation) (creditos_service_resource_saturation_ratio{environment=~\".+\"}) > 0.85"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "saturation"
        annotations:
          dashboard: "dashboards/internal/platform-overview"
          description: "Uso agregado de recurso técnico acima do limite operacional."
          runbook: "runbooks/observability/service-saturation.md"
          summary: "Saturação elevada por serviço"
      - alert: "HealthReadinessDown"
        expr: "min by (service, environment, operation) (creditos_service_ready{environment=~\".+\"}) < 1"
        for: "2m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "availability"
        annotations:
          dashboard: "dashboards/internal/platform-overview"
          description: "Serviço reporta condição operacional indisponível."
          runbook: "runbooks/observability/health-readiness-down.md"
          summary: "Health ou readiness indisponível"
  - name: "creditos-internal-messaging-dlq"
    interval: "30s"
    rules:
      - alert: "NatsJetStreamBacklogHigh"
        expr: "sum by (service, environment, source) (creditos_nats_backlog_messages{environment=~\".+\"}) > 1000"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "messaging"
        annotations:
          dashboard: "dashboards/internal/nats-jetstream-dlq"
          description: "Backlog agregado acima do limite operacional."
          runbook: "runbooks/observability/nats-backlog.md"
          summary: "Backlog elevado em mensageria"
      - alert: "NatsConsumerLagHigh"
        expr: "max by (service, environment, destination) (creditos_nats_consumer_lag_messages{environment=~\".+\"}) > 500"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "messaging"
        annotations:
          dashboard: "dashboards/internal/nats-jetstream-dlq"
          description: "Lag agregado de consumo acima do limite operacional."
          runbook: "runbooks/observability/nats-consumer-lag.md"
          summary: "Lag elevado em consumer"
      - alert: "DeadLetterQueueGrowing"
        expr: "sum by (service, environment, destination) (increase(creditos_dlq_messages_total{environment=~\".+\"}[15m])) > 0"
        for: "5m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "dlq"
        annotations:
          dashboard: "dashboards/internal/nats-jetstream-dlq"
          description: "Fila de erro recebeu mensagens no intervalo monitorado."
          runbook: "runbooks/observability/dead-letter-queue.md"
          summary: "DLQ crescendo"
      - alert: "ReplayOrReprocessStalled"
        expr: "max by (service, environment, operation) (creditos_reprocess_oldest_age_seconds{environment=~\".+\"}) > 1800"
        for: "15m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "reprocess"
        annotations:
          dashboard: "dashboards/internal/nats-jetstream-dlq"
          description: "Idade agregada de reprocessamento acima do limite operacional."
          runbook: "runbooks/observability/reprocess-stalled.md"
          summary: "Reprocessamento parado"
  - name: "creditos-internal-audit-security"
    interval: "30s"
    rules:
      - alert: "AuditCriticalFailure"
        expr: "sum by (service, environment, operation) (increase(creditos_audit_critical_failures_total{environment=~\".+\"}[5m])) > 0"
        for: "1m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "audit"
        annotations:
          dashboard: "dashboards/internal/audit-security"
          description: "Persistência de evidência crítica falhou e exige contenção operacional."
          runbook: "runbooks/observability/audit-critical-failure.md"
          summary: "Falha crítica de auditoria"
      - alert: "CrossTenantAttemptDetected"
        expr: "sum by (service, environment, tenant_isolation_tier) (increase(creditos_cross_boundary_attempts_total{environment=~\".+\"}[5m])) > 0"
        for: "1m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "security"
        annotations:
          dashboard: "dashboards/internal/audit-security"
          description: "Sinal agregado de isolamento violado ou tentativa bloqueada."
          runbook: "runbooks/observability/cross-boundary-attempt.md"
          summary: "Tentativa de acesso entre tenants detectada"
      - alert: "SensitiveDataLeakPotential"
        expr: "sum by (service, environment, operation) (increase(creditos_privacy_gate_failures_total{environment=~\".+\"}[5m])) > 0"
        for: "1m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "privacy"
        annotations:
          dashboard: "dashboards/internal/audit-security"
          description: "Gate de privacidade detectou emissão operacional insegura."
          runbook: "runbooks/observability/sensitive-data-leak-potential.md"
          summary: "Possível exposição de dado sensível"
  - name: "creditos-internal-integrations"
    interval: "30s"
    rules:
      - alert: "ExternalIntegrationFailureRateHigh"
        expr: "sum by (service, environment, integration_class, destination) (rate(creditos_integration_requests_total{environment=~\".+\",status=~\"error|failed\"}[5m])) / sum by (service, environment, integration_class, destination) (rate(creditos_integration_requests_total{environment=~\".+\"}[5m])) > 0.10"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "integration"
        annotations:
          dashboard: "dashboards/internal/external-integrations"
          description: "Taxa agregada de falha de integração acima do limite operacional."
          runbook: "runbooks/observability/external-integration-failures.md"
          summary: "Falhas elevadas em integração externa"
      - alert: "ExternalIntegrationTimeoutHigh"
        expr: "sum by (service, environment, integration_class, destination) (increase(creditos_integration_timeouts_total{environment=~\".+\"}[10m])) > 5"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "integration"
        annotations:
          dashboard: "dashboards/internal/external-integrations"
          description: "Volume agregado de timeout acima do limite operacional."
          runbook: "runbooks/observability/external-integration-timeouts.md"
          summary: "Timeout elevado em integração externa"
      - alert: "ExternalIntegrationFallbackHigh"
        expr: "sum by (service, environment, integration_class, destination) (increase(creditos_integration_fallbacks_total{environment=~\".+\"}[15m])) > 10"
        for: "15m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "info"
          signal_class: "integration"
        annotations:
          dashboard: "dashboards/internal/external-integrations"
          description: "Uso agregado de fallback acima do comportamento esperado."
          runbook: "runbooks/observability/external-integration-fallbacks.md"
          summary: "Fallback elevado em integração externa"
  - name: "creditos-internal-database"
    interval: "30s"
    rules:
      - alert: "DatabaseLatencyHigh"
        expr: "histogram_quantile(0.95, sum by (service, environment, pool, le) (rate(creditos_database_operation_duration_bucket{environment=~\".+\"}[5m]))) > 500"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "database"
        annotations:
          dashboard: "dashboards/internal/database-health"
          description: "Percentil p95 de banco acima do limite operacional."
          runbook: "runbooks/observability/database-latency.md"
          summary: "Latência elevada de banco"
      - alert: "DatabaseErrorRateHigh"
        expr: "sum by (service, environment, pool) (rate(creditos_database_operation_total{environment=~\".+\",status=~\"error|failed\"}[5m])) / clamp_min(sum by (service, environment, pool) (rate(creditos_database_operation_total{environment=~\".+\"}[5m])), 0.001) > 0.05"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "database"
        annotations:
          dashboard: "dashboards/internal/database-health"
          description: "Falha técnica de banco acima do limite operacional."
          runbook: "runbooks/observability/database-errors.md"
          summary: "Erros elevados de banco"
      - alert: "DatabaseSaturationHigh"
        expr: "max by (service, environment, pool) (creditos_database_connection_pool_usage_ratio{environment=~\".+\"}) > 0.85"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "database"
        annotations:
          dashboard: "dashboards/internal/database-health"
          description: "Pool lógico de banco acima do limite operacional."
          runbook: "runbooks/observability/database-saturation.md"
          summary: "Saturação elevada de banco"
  - name: "creditos-internal-deploy-slo-watch"
    interval: "30s"
    rules:
      - alert: "PostDeployErrorRegression"
        expr: "sum by (service, environment, version, release_ref) (rate(creditos_requests_total{environment=~\".+\",status=~\"error|failed\",version=~\".+\",release_ref=~\".+\"}[10m])) / clamp_min(sum by (service, environment, version, release_ref) (rate(creditos_requests_total{environment=~\".+\",version=~\".+\",release_ref=~\".+\"}[10m])), 0.001) > 0.05"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          release_ref: "{{ $labels.release_ref }}"
          service: "{{ $labels.service }}"
          severity: "critical"
          signal_class: "deploy-slo"
          version: "{{ $labels.version }}"
        annotations:
          dashboard: "dashboards/internal/deploy-release-health"
          description: "Erro agregado após release acima do limite; avaliar rollback ou roll-forward."
          runbook: "runbooks/observability/post-deploy-error-regression.md"
          summary: "Regressão de erro pós-deploy"
      - alert: "PostDeployLatencyRegression"
        expr: "histogram_quantile(0.95, sum by (service, environment, version, release_ref, le) (rate(creditos_request_duration_bucket{environment=~\".+\",version=~\".+\",release_ref=~\".+\"}[10m]))) > 1000"
        for: "10m"
        keep_firing_for: "5m"
        labels:
          environment: "{{ $labels.environment }}"
          release_ref: "{{ $labels.release_ref }}"
          service: "{{ $labels.service }}"
          severity: "warning"
          signal_class: "deploy-slo"
          version: "{{ $labels.version }}"
        annotations:
          dashboard: "dashboards/internal/deploy-release-health"
          description: "Latência após release acima do limite; avaliar rollback ou roll-forward."
          runbook: "runbooks/observability/post-deploy-latency-regression.md"
          summary: "Regressão de latência pós-deploy"
