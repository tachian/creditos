[project]
name = "creditos-reporting-insights"
version = "0.1.0"
description = "Microsserviço Reporting & Insights do CreditOS"
requires-python = ">=3.13"
dependencies = [
  "creditos-contracts",
  "creditos-observability",
  "creditos-security",
]

[tool.uv.sources]
creditos-contracts = { workspace = true }
creditos-observability = { workspace = true }
creditos-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
